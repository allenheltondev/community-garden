$kind: http-request
name: List Testimonials
description: |-
  Retrieve admin-managed testimonials for the authenticated admin console.
method: GET
url: '{{baseUrl}}/admin/testimonials'
order: 2700
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      const response = pm.response.json();

      pm.test("Response contains items array", function () {
          pm.expect(response).to.have.property("items");
          pm.expect(Array.isArray(response.items)).to.eql(true);
      });

      pm.test("Testimonials expose quote, attribution, and sort order when present", function () {
          if (response.items.length === 0) return;
          pm.expect(response.items[0]).to.have.property("quote");
          pm.expect(response.items[0]).to.have.property("attribution");
          pm.expect(response.items[0]).to.have.property("sort_order");
      });
