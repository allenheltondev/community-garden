$kind: http-request
name: List Impact Metrics
description: |-
  Retrieve admin-managed impact metrics for the authenticated admin console.
method: GET
url: '{{baseUrl}}/admin/impact-metrics'
order: 2600
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      const response = pm.response.json();

      pm.test("Response contains items array", function () {
          pm.expect(response).to.have.property("items");
          pm.expect(Array.isArray(response.items)).to.eql(true);
      });

      pm.test("Metrics expose label, value, and sort order when present", function () {
          if (response.items.length === 0) return;
          pm.expect(response.items[0]).to.have.property("label");
          pm.expect(response.items[0]).to.have.property("value");
          pm.expect(response.items[0]).to.have.property("sort_order");
      });
