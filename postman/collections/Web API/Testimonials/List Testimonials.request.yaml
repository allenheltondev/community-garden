$kind: http-request
name: List Testimonials
description: |-
  Public read of admin-managed testimonials shown on the foundation home page.
  Returns an empty items array when none are configured.
method: GET
url: '{{webBaseUrl}}/testimonials'
order: 960
headers:
  - key: X-Correlation-Id
    value: postman-testimonials-list
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("GET /testimonials returns 200", function () {
          pm.response.to.have.status(200);
      });

      const body = pm.response.json();

      pm.test("Response contains an items array", function () {
          pm.expect(body).to.have.property("items");
          pm.expect(Array.isArray(body.items)).to.eql(true);
      });

      pm.test("Each testimonial exposes quote and attribution", function () {
          if (body.items.length === 0) return;
          pm.expect(body.items[0]).to.have.property("quote");
          pm.expect(body.items[0]).to.have.property("attribution");
      });

      pm.test("Response includes correlation id header", function () {
          pm.expect(pm.response.headers.get("x-correlation-id")).to.be.a("string").and.not.empty;
      });
