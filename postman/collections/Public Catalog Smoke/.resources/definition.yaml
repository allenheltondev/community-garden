$kind: collection
name: Public Catalog Smoke
description: |-
  No-auth smoke test for the public catalog API.

  Verifies that the catalog crops endpoint returns data and that
  a variety lookup succeeds for the first returned crop.

  ## Steps
  1. List catalog crops — assert 200, non-empty array, valid crop shape
  2. List varieties for the first crop — assert 200, array response

  ## Authentication
  None required. Both endpoints are public.

  ## Why the cache-buster
  The API is edge-optimized, so CloudFront fronts it and caches 4xx responses
  for five minutes by default. This collection runs seconds after a deploy, so
  a 401 served to anyone shortly before it would otherwise be replayed here and
  fail a correct deployment. The `cb` query parameter makes each run measure
  the origin; the API ignores it.
variables:
  - key: baseUrl
    value: 'https://api.example.com'
    description: API base URL
  - key: catalogCropId
    value: ''
    description: Captured from Step 1 response
