$kind: http-request
name: Step 2 - List Crop Varieties
description: |-
  Fetch varieties for the crop captured in Step 1. No authentication required.
method: GET
url: '{{baseUrl}}/catalog/crops/:cropId/varieties?cb={{$guid}}'
order: 2000
auth:
  type: noauth
pathVariables:
  - key: cropId
    value: '{{catalogCropId}}'
    description: UUID of the catalog crop from Step 1
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          // .header(name, value) does an exact string match; passing a regex
          // stringifies it and can never match. Assert on the value instead.
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/json/);
      });

      const varieties = pm.response.json();

      pm.test("Response is an array", function () {
          pm.expect(Array.isArray(varieties)).to.be.true;
      });
