$kind: http-request
name: List API Keys
description: |-
  List the user's active API keys and confirm secrets are never returned. The
  list is empty for a grower whose access has not been approved, so the shape
  is what is asserted rather than a minimum length.
method: GET
url: '{{baseUrl}}/me/api-keys'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response lists keys without secrets", function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property("items").that.is.an("array");

          if (pm.collectionVariables.get("apiKeyIssued") === "true") {
              pm.expect(body.items.length, "the key just created should be listed").to.be.at.least(1);
          }

          for (const item of body.items) {
              pm.expect(item).to.have.property("id");
              pm.expect(item).to.have.property("name");
              pm.expect(item).to.have.property("keyPrefix");
              pm.expect(item).to.not.have.property("key");
              pm.expect(item).to.not.have.property("keyHash");
              pm.expect(item).to.not.have.property("awsApiKeyId");
          }
      });
