$kind: http-request
name: Second Key Needs A New Approval
description: |-
  One approval mints one key. Creating again straight after a successful
  creation must be refused, or the gate would be decorative — an approved
  grower could self-issue an unlimited series of credentials.
method: POST
url: '{{baseUrl}}/me/api-keys'
order: 2500
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman second key"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Refusal explains that approval comes first, and returns no key", function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property("error");
          pm.expect(body.error).to.match(/approved/i);
          pm.expect(body).to.not.have.property("key");
      });
