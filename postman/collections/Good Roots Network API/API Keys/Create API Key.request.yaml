$kind: http-request
name: Create API Key
description: |-
  Mint a key against an approved access request. Without an approval this is a
  403 — that gate is the whole point of the access request flow, since a key
  self-issued outside it would sit on no usage plan.

  Sets `apiKeyIssued` so the lifecycle requests below know whether they are
  exercising a real key or the not-found path.
method: POST
url: '{{baseUrl}}/me/api-keys'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman integration key"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 (approved) or 403 (not approved)", function () {
          pm.expect([201, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 403) {
          pm.test("Refusal explains that approval comes first", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.property("error");
              pm.expect(body.error).to.match(/approved/i);
              // A refused create must not hand back a credential.
              pm.expect(body).to.not.have.property("key");
          });
          pm.collectionVariables.set("apiKeyIssued", "false");
          pm.collectionVariables.set("apiKeyId", "00000000-0000-4000-8000-000000000000");
          return;
      }

      pm.test("Response returns the one-time secret and metadata", function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property("id");
          pm.expect(body).to.have.property("name", "Postman integration key");
          pm.expect(body).to.have.property("keyPrefix");
          pm.expect(body).to.have.property("key");
          pm.expect(body.key).to.be.a("string").and.match(/^grnk_/);
          pm.expect(body.keyPrefix).to.match(/^grnk_/);
          // The API Gateway key and usage plan behind this credential are
          // deliberately invisible to the caller.
          pm.expect(body).to.not.have.property("awsApiKeyId");
          pm.expect(body).to.not.have.property("usagePlanId");

          if (!body.id) {
              pm.expect.fail("Missing api key id; aborting chained run.");
              pm.execution.setNextRequest(null);
              return;
          }
          pm.collectionVariables.set("apiKeyId", body.id);
          pm.collectionVariables.set("apiKeyIssued", "true");
      });
