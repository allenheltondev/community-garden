$kind: http-request
name: Delete API Key
description: |-
  Revoke (soft-delete) the API key created earlier in this run. Revoking also
  disables the API Gateway key behind it, so the credential stops drawing on the
  integration usage plan. Falls back to asserting the 404 when no key existed.
method: DELETE
url: '{{baseUrl}}/me/api-keys/:apiKeyId'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
pathVariables:
  - key: apiKeyId
    value: '{{apiKeyId}}'
    description: UUID of the API key
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const apiKeyId = pm.collectionVariables.get("apiKeyId");
      const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      pm.test("apiKeyId is set and valid UUID", function () {
          pm.expect(apiKeyId, "apiKeyId is required").to.be.a("string").and.not.empty;
          pm.expect(apiKeyId).to.match(uuidRe);
      });
      if (!apiKeyId || !uuidRe.test(apiKeyId)) {
          postman.setNextRequest(null);
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.collectionVariables.get("apiKeyIssued") !== "true") {
          pm.test("An id the caller does not own is a 404", function () {
              pm.response.to.have.status(404);
          });
          pm.collectionVariables.unset("apiKeyId");
          return;
      }

      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });

      pm.collectionVariables.unset("apiKeyId");
      pm.collectionVariables.unset("apiKeyIssued");
