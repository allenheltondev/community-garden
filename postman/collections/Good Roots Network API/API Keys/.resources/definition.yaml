$kind: collection
name: API Keys
description: |-
  Key issuance and lifecycle. Minting a key consumes an approved access
  request, so this folder runs after "API Access" and its first request asserts
  the gate.

  CI signs in as a grower and there is no admin token to approve with, so the
  expected path here is the refusal. When an approval does exist — a staging
  environment where someone approved by hand — the folder runs the full
  lifecycle instead. Both branches assert; neither is skipped silently.
order: 11600
