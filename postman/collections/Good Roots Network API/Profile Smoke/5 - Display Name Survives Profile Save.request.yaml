$kind: http-request
name: 'Display Name Survives Profile Save (GET /me)'
description: |-
  Asserts the outcome of request 4: the display name set earlier is still in
  place after a profile-only save, and the profile change itself landed.
method: GET
url: '{{baseUrl}}/me'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      const jsonData = pm.response.json();

      pm.test("Display name set earlier was not overwritten", function () {
          pm.expect(jsonData).to.have.property("displayName", "Profile Smoke Test User");
      });

      pm.test("The profile change in the same request was applied", function () {
          pm.expect(jsonData).to.have.property("growerProfile");
          // GET /me reports shareRadiusMiles as a decimal string ("20.0") because
          // it is stored in kilometres and converted through text, while PUT /me
          // takes a number. Asserted numerically so this documents the asymmetry
          // rather than pinning the exact string formatting.
          pm.expect(Number(jsonData.growerProfile.shareRadiusMiles)).to.eql(20);
      });

      pm.test("shareRadiusMiles is still reported as a string", function () {
          pm.expect(jsonData.growerProfile.shareRadiusMiles).to.be.a("string");
      });
