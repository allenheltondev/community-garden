AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Core services for Good Roots Network

Parameters:
  DomainProtocol:
    Type: String
    Default: https
    AllowedValues: ["https", "http"]
  DomainHostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 Hosted Zone Id for the front end custom domain
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string for Neon database
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues:
      - dev
      - staging
      - prod
      - pr
    Description: Deployment environment name used for environment-specific resources
  DomainName:
    Type: String
    Default: ""
    Description: Optional root domain name used to derive the GRN frontend and shared API custom domain
  StripeSecretKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Stripe secret key for subscription and store operations
  StripeWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Stripe webhook signing secret
  StripeProPriceId:
    Type: String
    Default: ""
    Description: Optional Stripe price id for GRN Pro checkout
  FirstPartyApiKeyValue:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Optional override for the usage-plan identifier the web app's own traffic
      is metered against, 20-128 alphanumeric characters. Leave empty to use a
      value derived from the account and environment. This is not a credential:
      with an AUTHORIZER key source API Gateway ignores any x-api-key a caller
      sends, so the only way onto a plan is to pass the authorizer.
Conditions:
  DeployCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref DomainHostedZoneId, ""]]
  DeployCiAuthSeedFunction: !Not [!Equals [!Ref EnvironmentName, prod]]
  HasFirstPartyKeyOverride: !Not [!Equals [!Ref FirstPartyApiKeyValue, ""]]
  DeploySharedApiBasePathMapping: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref DomainHostedZoneId, ""]]

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,Idempotency-Key,X-Correlation-Id,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: !If
        - DeployCustomDomain
        - !Sub "'${DomainProtocol}://grn.${DomainName}'"
        - "'*'"
  Function:
    Architectures: [ arm64 ]
    Tracing: Disabled
    Timeout: 2
    MemorySize: 1024

Metadata:
  esbuild-properties: &esbuild-properties
    Format: esm
    Minify: true
    OutExtension:
      - .js=.mjs
    Target: es2020
    Sourcemap: false
    EntryPoints:
      - index.mjs
    Banner:
      - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    External:
      - '@aws-sdk/*'

Resources:
  # Database connection is managed externally via Neon Postgres
  # DATABASE_URL is provided as an environment variable to Lambda functions

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-events"

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "Good Roots Network API (${EnvironmentName})"
      TracingEnabled: false
      StageName: api
      # Usage-plan keys come from the authorizer's `usageIdentifierKey`, never
      # from an `x-api-key` header. That is what keeps the plan invisible:
      # integrators send only their `grnk_…` bearer token, and a caller cannot
      # put themselves on a plan by guessing a key value.
      ApiKeySourceType: AUTHORIZER
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,Idempotency-Key,X-Correlation-Id,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        # Two front ends call this API (the GRN app and the admin console) and a
        # static preflight value can only name one. Preflight therefore permits
        # any origin to *ask*; the gate that matters is the router, which echoes
        # Access-Control-Allow-Origin only for ORIGIN and ADMIN_ORIGIN, so a
        # third-party page still cannot read a response. Every route also
        # requires a bearer token, and no browser credentials are used.
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: LambdaAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          LambdaAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt LambdaAuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
      MethodSettings:
        - MetricsEnabled: True
          ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: ERROR
          DataTraceEnabled: True

  # Throttle and quota for approved integrations. The key attached to this plan
  # is provisioned per grower on approval and never handed to them: the
  # authorizer resolves their GRN key to it, so the plan applies without the
  # integrator sending anything extra.
  #
  # ENFORCEMENT
  # -----------
  # Everything enforcement needs is in place and the authorizer now returns a
  # usage-plan identifier for every caller. The switch itself is one line —
  # `Auth: {ApiKeyRequired: true}` on the ApiProxy event below — and it must go
  # in a LATER deploy than this one, not the same one.
  #
  # The reason is the authorizer result cache. ReauthorizeEvery is unset, so
  # API Gateway caches each policy for 300s keyed on the Authorization header.
  # Policies cached before FIRST_PARTY_API_KEY_VALUE was populated carry no
  # usage identifier, and serving one of those against a key-requiring method
  # is a 403. Deploying the identifier first lets the cache refill with it;
  # after five minutes every cached policy carries a key and the switch is a
  # no-op for callers.
  #
  # The API is a single `/{proxy+}` ANY method — path dispatch happens inside
  # the Rust router, so API Gateway has no notion of a "crop endpoint". That
  # makes ApiKeyRequired all-or-nothing: it cannot be scoped to plants, crops,
  # or garden planning without splitting the proxy into per-path resources.
  # Scoping comes instead from *which plan a key sits on*: integrators land on
  # this plan and are throttled, the web app lands on FirstPartyUsagePlan and is
  # effectively not.
  #
  # Two kinds of caller have no key of their own and rely on that fallback:
  # Cognito sessions (the web app and admin console) and unauthenticated public
  # catalog reads. Both are metered as first-party. So are self-serve keys
  # issued before migration 0041, which have no API Gateway key behind them —
  # returning their hash would hand API Gateway an identifier it cannot resolve
  # and 403 them. Reissue those through the approval flow to move them onto
  # this plan; nothing breaks in the meantime.
  #
  # To turn enforcement back off later, delete the `Auth` block from ApiProxy.
  # Leave the plans and the key in place: they are what the authorizer already
  # returns, and removing them is what would break callers.
  IntegrationUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiapiStage
    Properties:
      UsagePlanName: !Sub 'grn-integrations-${EnvironmentName}'
      Description: Approved third-party integrations against the Good Roots API
      ApiStages:
        - ApiId: !Ref Api
          Stage: api
      Throttle:
        BurstLimit: 20
        RateLimit: 10
      Quota:
        Limit: 50000
        Period: MONTH

  # The web app's own traffic. Every browser caller shares this one key, so the
  # throttle here is a single bucket for the whole app — it is set far above
  # real load and carries no quota on purpose. This plan exists to keep
  # first-party requests working under enforcement and to separate their
  # metrics from integration traffic, not to ration the app against its own
  # users. Lowering it would turn a shared bucket into an outage.
  FirstPartyUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiapiStage
    Properties:
      UsagePlanName: !Sub 'grn-first-party-${EnvironmentName}'
      Description: Good Roots web app and admin console traffic
      ApiStages:
        - ApiId: !Ref Api
          Stage: api
      Throttle:
        BurstLimit: 10000
        RateLimit: 5000

  FirstPartyApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub 'grn-first-party-${EnvironmentName}'
      Description: Usage identifier the authorizer returns for Cognito callers
      Enabled: true
      # A CloudFormation parameter default cannot be computed, so the fallback
      # lives here. Alphanumeric and comfortably over API Gateway's 20-character
      # minimum, and unique per account and environment.
      Value: !If
        - HasFirstPartyKeyOverride
        - !Ref FirstPartyApiKeyValue
        - !Sub 'grnfirstparty${AWS::AccountId}${EnvironmentName}'

  FirstPartyUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref FirstPartyApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref FirstPartyUsagePlan

  # GRN publishes to its own bus, but the notifications consumer — the thing
  # that turns an event into a Slack message — has its rule on the default bus.
  # Forward the access-request events across so approvals actually get noticed.
  # Scoped to this one source rather than everything on the bus, so unrelated
  # GRN events are not duplicated onto default.
  ApiAccessEventForwardingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-api-access-to-default'
      Description: Forward API access request events to the default bus for Slack notifications
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - grn.api-access
      Targets:
        - Id: DefaultBus
          Arn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default'
          RoleArn: !GetAtt ApiAccessEventForwardingRole.Arn

  ApiAccessEventForwardingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ForwardToDefaultBus
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default'

  SharedApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: DeploySharedApiBasePathMapping
    DependsOn:
      - ApiapiStage
    Properties:
      DomainName: !Sub 'api.${DomainName}'
      RestApiId: !Ref Api
      Stage: api
      BasePath: grn

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  # Using AWS managed ResponseHeadersPolicy instead of stack-managed custom policy.
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Aliases: !If
          - DeployCustomDomain
          - [!Sub 'grn.${DomainName}']
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - DeployCustomDomain
          - AcmCertificateArn: !Ref FrontendCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Use AWS-managed security headers policy to avoid per-stack policy quota exhaustion.
          ResponseHeadersPolicyId: "67f7725c-6f97-4210-82d7-5512b31e9d03"
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: DeployCustomDomain
    Properties:
      DomainName: !Sub 'grn.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub 'grn.${DomainName}'
          HostedZoneId: !Ref DomainHostedZoneId

  FrontendDNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: DeployCustomDomain
    Properties:
      HostedZoneId: !Ref DomainHostedZoneId
      Name: !Sub 'grn.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LambdaAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: lambda-authorizer
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminListGroupsForUser
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
                - UserPoolId: !ImportValue OGF-UserPoolId
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          USER_POOL_ID: !ImportValue OGF-UserPoolId
          USER_POOL_CLIENT_ID: !ImportValue OGF-UserPoolClientId
          # Returned as the usageIdentifierKey for every caller that is not
          # presenting a GRN API key: Cognito sessions, public catalog reads,
          # preflight, and pre-0041 keys with no API Gateway key of their own.
          # Enforcement is on, so this must always resolve — an empty value here
          # is a 403 for the entire web app. Must match FirstPartyApiKey's Value.
          FIRST_PARTY_API_KEY_VALUE: !If
            - HasFirstPartyKeyOverride
            - !Ref FirstPartyApiKeyValue
            - !Sub 'grnfirstparty${AWS::AccountId}${EnvironmentName}'

  CiAuthSeedUsersFunction:
    Type: AWS::Serverless::Function
    Condition: DeployCiAuthSeedFunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - ci-auth-seed.mjs
    Properties:
      CodeUri: functions
      Handler: ci-auth-seed.handler
      Runtime: nodejs24.x
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminInitiateAuth
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
                - UserPoolId: !ImportValue OGF-UserPoolId
      Environment:
        Variables:
          USER_POOL_ID: !ImportValue OGF-UserPoolId
          USER_POOL_CLIENT_ID: !ImportValue OGF-UserPoolClientId
          DATABASE_URL: !Ref DatabaseUrl

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: api
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Timeout: 5
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt EventBus.Arn
            # Garden designer uploads land here. Presigned PUT URLs are
            # signed with the ApiFunction's role, so S3 evaluates this
            # policy when the browser PUTs the image. Restricted to the
            # garden-backgrounds/ prefix so the role can't be repurposed
            # to write anywhere else in the shared assets bucket.
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub
                - '${SharedAssetsBucketArn}/garden-backgrounds/*'
                - SharedAssetsBucketArn: !ImportValue OGF-AssetsBucketArn
            # Journal photos are private application records. The API issues
            # short-lived signed PUT/GET URLs and deletes the object when its
            # owning note is removed.
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub
                - '${SharedAssetsBucketArn}/journal-photos/*'
                - SharedAssetsBucketArn: !ImportValue OGF-AssetsBucketArn
            # Approving an API access request provisions the API Gateway key
            # that carries the integrator's usage plan, and revoking their GRN
            # key disables it again. Scoped to the key and usage-plan
            # collections rather than the whole API surface.
            - Effect: Allow
              Action:
                - apigateway:POST
                - apigateway:PATCH
                - apigateway:GET
              Resource:
                - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys'
                - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys/*'
                # The collection itself is needed to resolve the plan's name to
                # its id, since the id cannot be passed in without a cycle.
                - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans'
                - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/*'
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          EVENT_BUS_NAME: !Ref EventBus
          # The plan's NAME, not !Ref its id. A Ref would make this function
          # depend on the usage plan, which depends on the stage, which depends
          # on this function — a cycle CloudFormation refuses to deploy. The
          # handler resolves name to id at call time; if the plan is not there
          # yet it issues the key unattached rather than blocking an approval.
          INTEGRATION_USAGE_PLAN_NAME: !Sub 'grn-integrations-${EnvironmentName}'
          ORIGIN: !If
            - DeployCustomDomain
            - !Sub "${DomainProtocol}://grn.${DomainName}"
            - "*"
          # The admin console reads and decides API access requests directly
          # against this service, because the requests are GRN records and this
          # is the service that owns them. The router echoes back whichever of
          # these two origins the caller sent, and no others.
          ADMIN_ORIGIN: !If
            - DeployCustomDomain
            - !Sub "${DomainProtocol}://admin.${DomainName}"
            - "*"
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          STRIPE_PRO_PRICE_ID: !Ref StripeProPriceId
          MEDIA_BUCKET_NAME: !ImportValue OGF-AssetsBucketName
          MEDIA_CDN_DOMAIN: !ImportValue OGF-AssetsPublicDomainName
          RUST_LOG: info
          RUST_BACKTRACE: "1"
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
            # ApiKeyRequired goes here to switch enforcement on. Do it in a
            # separate deploy from the one that first populates
            # FIRST_PARTY_API_KEY_VALUE — see the ENFORCEMENT note above.

  RollingGeoAggregationWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - rolling-geo-aggregation.mjs
    Properties:
      CodeUri: functions
      Handler: rolling-geo-aggregation.handler
      Runtime: nodejs24.x
      Timeout: 15
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
      Events:
        ListingCreatedEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - grn.api
              detail-type:
                - listing.created
                - listing.updated
                - request.created
                - request.updated
                - claim.created
                - claim.updated


  ProfileDerivedWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - profile-derived-worker.mjs
    Properties:
      CodeUri: functions
      Handler: profile-derived-worker.handler
      Runtime: nodejs24.x
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
      Events:
        ProfileUpdatedEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - grn.api
              detail-type:
                - user.profile.updated
                - listing.created
                - listing.updated
                - claim.created
                - claim.updated

  # CatalogSeedFunction:
  #   Type: AWS::Serverless::Function
  #   Metadata:
  #     BuildMethod: esbuild
  #     BuildProperties:
  #       <<: *esbuild-properties
  #       EntryPoints:
  #         - catalog-seed.mjs
  #   Properties:
  #     CodeUri: functions
  #     Handler: catalog-seed.handler
  #     Runtime: nodejs24.x
  #     Timeout: 120
  #     MemorySize: 512
  #     Policies:
  #       - AWSLambdaBasicExecutionRole
  #     Environment:
  #       Variables:
  #         DATABASE_URL: !Ref DatabaseUrl

  # CatalogSeedTrigger:
  #   Type: Custom::CatalogSeed
  #   Properties:
  #     ServiceToken: !GetAtt CatalogSeedFunction.Arn
  #     SeedVersion: "1"

  ProStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: pro-template.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        EventBusArn: !GetAtt EventBus.Arn

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !If
      - DeploySharedApiBasePathMapping
      - !Sub
        - "https://api.${RootDomainName}/grn"
        - RootDomainName: !Ref DomainName
      - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/api"

  EventBusName:
    Description: Name of the EventBridge custom bus
    Value: !Ref EventBus

  FrontendUrl:
    Description: CloudFront distribution URL for frontend
    Value: !If
      - DeployCustomDomain
      - !Sub "${DomainProtocol}://grn.${DomainName}"
      - !Sub "https://${FrontendDistribution.DomainName}"

  FrontendBucket:
    Description: S3 bucket name for frontend deployment
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID for cache invalidation
    Value: !Ref FrontendDistribution

  CiAuthSeedUsersFunctionName:
    Description: Lambda name used to generate temporary Cognito JWTs for CI Postman runs
    Value: !If
      - DeployCiAuthSeedFunction
      - !Ref CiAuthSeedUsersFunction
      - "NONE"

  ProAgentTaskQueueUrl:
    Description: URL of the pro agent task queue in the nested pro stack
    Value: !GetAtt ProStack.Outputs.PremiumAgentTaskQueueUrl

  ProAgentTaskQueueArn:
    Description: ARN of the pro agent task queue in the nested pro stack
    Value: !GetAtt ProStack.Outputs.PremiumAgentTaskQueueArn
