/garden/share:
  get:
    tags: [Garden, Idempotent]
    summary: Get your garden's share link
    description: Returns the active share link, if the garden is currently shared.
    operationId: getMyShareLink
    responses:
      '200':
        description: The active share link
        content:
          application/json:
            schema:
              $ref: '../schemas/garden-share.yaml#/ShareLink'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        description: The garden is not shared
        content:
          application/json:
            schema:
              $ref: '../schemas/_responses.yaml#/ErrorSchema'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  post:
    tags: [Garden, Idempotent]
    summary: Share your garden
    description: |
      Creates a share link, or returns the existing one with 200 when the
      garden is already shared, so repeating the call cannot rotate a link
      people have already been given.
    operationId: createMyShareLink
    responses:
      '200':
        description: The garden was already shared; the existing link is returned
        content:
          application/json:
            schema:
              $ref: '../schemas/garden-share.yaml#/ShareLink'
      '201':
        description: Newly created share link
        content:
          application/json:
            schema:
              $ref: '../schemas/garden-share.yaml#/ShareLink'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  delete:
    tags: [Garden]
    summary: Stop sharing your garden
    description: Revokes the link. Anyone holding it gets a 404 afterwards.
    operationId: revokeMyShareLink
    responses:
      '204':
        description: Sharing stopped
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'

/shared-gardens/{token}:
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: The share token from `GET /garden/share`.
  get:
    tags: [Garden, Idempotent, Public]
    summary: View a shared garden
    description: |
      Reads a garden someone has chosen to share. No authentication: the point
      of a share link is that it works for a visitor who is not signed in.
    operationId: getSharedGarden
    security: []
    responses:
      '200':
        description: The shared garden
        content:
          application/json:
            schema:
              $ref: '../schemas/garden-share.yaml#/SharedGarden'
      '404':
        description: Unknown or revoked token
        content:
          application/json:
            schema:
              $ref: '../schemas/_responses.yaml#/ErrorSchema'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
