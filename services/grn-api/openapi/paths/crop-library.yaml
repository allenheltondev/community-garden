/crops:
  get:
    tags: [Crop Library, Idempotent]
    summary: List current user's crop library entries
    operationId: listMyCrops
    responses:
      '200':
        description: Crop library rows
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/crop-library.yaml#/GrowerCropItem'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  post:
    tags: [Crop Library]
    summary: Create a crop library entry
    operationId: createMyCrop
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/crop-library.yaml#/UpsertGrowerCropRequest'
    responses:
      '201':
        description: Created crop library row
        content:
          application/json:
            schema:
              $ref: '../schemas/crop-library.yaml#/GrowerCropItem'
      '400':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'

/crops/{cropLibraryId}:
  parameters:
    - in: path
      name: cropLibraryId
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags: [Crop Library, Idempotent]
    summary: Get one crop library entry
    operationId: getMyCrop
    responses:
      '200':
        description: Crop library row
        content:
          application/json:
            schema:
              $ref: '../schemas/crop-library.yaml#/GrowerCropItem'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  put:
    tags: [Crop Library]
    summary: Update one crop library entry
    operationId: updateMyCrop
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/crop-library.yaml#/UpsertGrowerCropRequest'
    responses:
      '200':
        description: Updated crop library row
        content:
          application/json:
            schema:
              $ref: '../schemas/crop-library.yaml#/GrowerCropItem'
      '400':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  delete:
    tags: [Crop Library]
    summary: Delete one crop library entry
    operationId: deleteMyCrop
    responses:
      '204':
        description: Deleted
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'

/crops/{cropLibraryId}/harvests:
  parameters:
    - in: path
      name: cropLibraryId
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags: [Crop Library, Idempotent]
    summary: List harvests logged for one crop
    description: |
      Returns the private harvest log for a single crop: the running total
      brought in, the number of entries, and every logged harvest newest-first.
      This is personal bookkeeping and is separate from surplus listings.
    operationId: listCropHarvests
    responses:
      '200':
        description: Harvest log for the crop
        content:
          application/json:
            schema:
              $ref: '../schemas/crop-library.yaml#/HarvestLogResponse'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  post:
    tags: [Crop Library]
    summary: Log a harvest for one crop
    description: |
      Records how much was brought in for this crop and returns the new entry
      plus the updated running total. When `unit` is omitted it falls back to
      the crop's `default_unit`; when `harvestedOn` is omitted it defaults to
      today.
    operationId: recordCropHarvest
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/crop-library.yaml#/RecordHarvestRequest'
    responses:
      '201':
        description: Harvest recorded
        content:
          application/json:
            schema:
              $ref: '../schemas/crop-library.yaml#/RecordHarvestResponse'
      '400':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'

/crops/{cropLibraryId}/harvests/{harvestId}:
  parameters:
    - in: path
      name: cropLibraryId
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: harvestId
      required: true
      schema:
        type: string
        format: uuid
  put:
    tags: [Crop Library]
    summary: Edit a logged harvest
    description: |
      Updates one harvest entry and returns it plus the recomputed running
      total. When `harvestedOn` is omitted the existing date is kept; when
      `unit` is omitted it falls back to the crop's `default_unit`.
    operationId: updateCropHarvest
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/crop-library.yaml#/RecordHarvestRequest'
    responses:
      '200':
        description: Harvest updated
        content:
          application/json:
            schema:
              $ref: '../schemas/crop-library.yaml#/RecordHarvestResponse'
      '400':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
  delete:
    tags: [Crop Library]
    summary: Delete a logged harvest
    description: Permanently removes one harvest entry. The running total is recomputed on the next read.
    operationId: deleteCropHarvest
    responses:
      '204':
        description: Deleted
      '401':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
