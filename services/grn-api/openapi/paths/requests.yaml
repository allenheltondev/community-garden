/requests:
  post:
    tags: [Requests, Idempotent]
    summary: Create a food request
    operationId: createRequest
    parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
        description: |-
          Optional. Retrying with the same key returns the original result
          rather than creating a duplicate; reusing a key for different
          content is the 409 below.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests.yaml#/UpsertRequestPayload'
    responses:
      '201':
        description: Created request
        content:
          application/json:
            schema:
              $ref: '../schemas/requests.yaml#/RequestResponse'
      '400':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '403':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '409':
        description: Idempotency key collision
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'

/requests/{requestId}:
  parameters:
    - in: path
      name: requestId
      required: true
      schema:
        type: string
        format: uuid
  put:
    tags: [Requests]
    summary: Update a food request
    operationId: updateRequest
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests.yaml#/UpsertRequestPayload'
    responses:
      '200':
        description: Updated request
        content:
          application/json:
            schema:
              $ref: '../schemas/requests.yaml#/RequestResponse'
      '400':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '403':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '404':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
      '500':
        $ref: '../schemas/_responses.yaml#/ErrorResponse'
