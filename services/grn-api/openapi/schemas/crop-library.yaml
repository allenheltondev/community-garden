GrowerCropItem:
  type: object
  description: |
    Grower crop-library record.

    This endpoint currently returns snake_case fields. `crop_id` is a backward-compatible
    alias of `canonical_id` and will be present with the same value when the crop is linked
    to the public catalog.
  required: [id, user_id, crop_name, status, visibility, surplus_enabled, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    crop_id:
      type: string
      format: uuid
      nullable: true
      deprecated: true
      description: "Backward-compatible alias of canonical_id"
    canonical_id:
      type: string
      format: uuid
      nullable: true
      description: "Links to catalog crop when available, null for user-defined crops"
    crop_name:
      type: string
      description: "User-defined crop name or catalog crop name"
    variety_id:
      type: string
      format: uuid
      nullable: true
    status:
      type: string
      enum: [interested, planning, growing, paused]
    visibility:
      type: string
      enum: [private, local, public]
    surplus_enabled:
      type: boolean
    nickname:
      type: string
      nullable: true
    default_unit:
      type: string
      nullable: true
    notes:
      type: string
      nullable: true
    total_harvested:
      type: string
      description: |
        Running total of everything harvested for this crop, summed across all
        logged harvests. Serialized as a string to preserve precision. Only
        present on the crop detail read (GET /crops/{cropLibraryId}); omitted
        from the list response.
    harvest_count:
      type: integer
      format: int64
      description: |
        Number of harvest entries logged for this crop. Only present on the
        crop detail read.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

RecordHarvestRequest:
  type: object
  description: Log a harvest against a crop in the user's library.
  required: [amount]
  properties:
    amount:
      type: number
      format: double
      description: How much was brought in. Must be greater than 0.
    unit:
      type: string
      nullable: true
      description: "Unit for the amount (e.g. \"lb\", \"bunch\"). Falls back to the crop's default_unit when omitted."
    harvestedOn:
      type: string
      format: date
      description: Date the harvest was brought in (YYYY-MM-DD). Defaults to today when omitted.
    notes:
      type: string
      nullable: true

HarvestItem:
  type: object
  required: [id, growerCropId, amount, harvestedOn, createdAt]
  properties:
    id:
      type: string
      format: uuid
    growerCropId:
      type: string
      format: uuid
    amount:
      type: string
      description: Amount brought in, serialized as a string to preserve precision.
    unit:
      type: string
      nullable: true
    harvestedOn:
      type: string
      format: date
    notes:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

HarvestLogResponse:
  type: object
  required: [growerCropId, totalHarvested, harvestCount, harvests]
  properties:
    growerCropId:
      type: string
      format: uuid
    totalHarvested:
      type: string
      description: Running total across all logged harvests, serialized as a string.
    harvestCount:
      type: integer
      format: int64
    harvests:
      type: array
      items:
        $ref: '#/HarvestItem'

RecordHarvestResponse:
  type: object
  required: [harvest, totalHarvested, harvestCount]
  properties:
    harvest:
      $ref: '#/HarvestItem'
    totalHarvested:
      type: string
      description: Updated running total after this harvest, serialized as a string.
    harvestCount:
      type: integer
      format: int64

UpsertGrowerCropRequest:
  type: object
  description: |
    Create or update a grower crop-library record.

    The request is valid when either `canonical_id` or `crop_name` is provided.
    The API also accepts the compatibility aliases `canonicalId`, `crop_id`, `cropId`,
    `cropName`, `surplusEnabled`, and `defaultUnit`.
  required: [status, visibility, surplus_enabled]
  anyOf:
    - required: [canonical_id]
    - required: [crop_name]
  properties:
    canonical_id:
      type: string
      format: uuid
      nullable: true
      description: "Optional link to catalog crop"
    crop_name:
      type: string
      description: "The crop name to display and use for this entry"
    variety_id:
      type: string
      format: uuid
      nullable: true
    status:
      type: string
      enum: [interested, planning, growing, paused]
    visibility:
      type: string
      enum: [private, local, public]
    surplus_enabled:
      type: boolean
    nickname:
      type: string
      nullable: true
    default_unit:
      type: string
      nullable: true
    notes:
      type: string
      nullable: true
