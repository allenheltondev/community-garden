JournalResponse:
  type: object
  title: JournalResponse
  required: [season, entries, summary]
  properties:
    season:
      type: integer
      description: The season (year) the entries were built for.
    entries:
      type: array
      items:
        type: object
    summary:
      type: object

CreateNoteRequest:
  type: object
  title: CreateNoteRequest
  # Mirrors CreateNoteRequest in handlers/journal.rs: occurredOn and title are
  # plain String fields and so are required by deserialization; body and
  # photoKey are Option and default to absent.
  required: [occurredOn, title]
  properties:
    occurredOn:
      type: string
      format: date
      description: The day the note is about.
    title:
      type: string
      description: Short label for the entry.
    body:
      type: string
      description: Optional longer text.
    photoKey:
      type: string
      description: Key returned by the photo upload intent, if a photo is attached.

JournalEntry:
  type: object
  title: JournalEntry

PhotoUploadIntent:
  type: object
  title: PhotoUploadIntent
  required: [uploadUrl, method, headers]
  properties:
    uploadUrl:
      type: string
      format: uri
    method:
      type: string
      enum: [PUT]
    headers:
      type: object
      properties:
        contentType:
          type: string

PhotoUploadRequest:
  type: object
  title: PhotoUploadRequest
  # Both fields are non-Option in PhotoUploadRequest; omitting contentLength
  # fails deserialization before the handler runs.
  required: [contentType, contentLength]
  properties:
    contentType:
      type: string
    contentLength:
      type: integer
      format: int64
